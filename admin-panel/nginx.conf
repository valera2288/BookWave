# Единая точка входа (ARCHITECTURE.md, «Развёртывание»): раздаёт
# собранный admin-panel SPA и проксирует API/admin/статику/медиа на
# backend — та же схема Nginx -> Gunicorn -> Django, что описана для
# продакшена, только без TLS-терминации (локальный docker-compose,
# реального домена/сертификата нет).
server {
    listen 80;
    server_name _;

    # По умолчанию Nginx принимает тело запроса до 1 МБ — форма книги в
    # админке отправляет обложку (до 5 МБ) и до трёх файлов книги (EPUB/
    # PDF/FB2, до 100 МБ каждый, ТЗ) одним multipart-запросом.
    client_max_body_size 310m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django-админка — только для баннеров (ARCHITECTURE.md, «Открытые
    # вопросы» п.7), сессионная аутентификация, отдельного SPA-экрана нет.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /backend-static/;
    }

    # ТЗ: прямой доступ к файлу книги по статической ссылке запрещён —
    # /media/books/ не раздаётся напрямую, только через защищённый
    # /api/files/... (который сам делает X-Accel-Redirect на
    # /protected-media/, см. ниже). Остальной media/ (обложки, баннеры,
    # аватары) публичный.
    location /media/books/ {
        deny all;
    }

    location /media/ {
        alias /backend-media/;
    }

    # Внутренний location для X-Accel-Redirect (apps/files/services.py,
    # PROTECTED_MEDIA_INTERNAL_LOCATION) — недоступен напрямую снаружи,
    # только по заголовку от Django после проверки владения книгой.
    location /protected-media/ {
        internal;
        alias /backend-media/;
    }
}
